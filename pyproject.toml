[project]
name = "nodeml"
version = "0.1.0"
description = "Build, train, tune and serve ML pipelines as typed DAGs of nodes."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "beartype>=0.22.9",
  "fastapi>=0.115",
  "ipywidgets>=8.1",
  "jaxtyping>=0.3.3",
  "mlflow>=3.10.1",
  "networkx>=3.4",
  "pandas>=2.3.3",
  "plotly>=6.6.0",
  "pyarrow>=21.0.0",
  "pydantic>=2.12.2",
  "pydantic-settings>=2.12.0",
  "ray[all]>=2.50.0",
  "scikit-learn>=1.8.0",
  "scipy>=1.15",
  "torch>=2.9.0",
  "torchmetrics>=1.9.0",
  "tqdm>=4.66",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipympl>=0.10.0",
    "jupyter>=1.1.1",
    "nbstripout>=0.8.1",
    "pandas-stubs>=3.0.0.260204",
    "pre-commit>=4.3.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.2",
    "ty>=0.0.1a24",
]
docs = [
    "sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
    "sphinx-autodoc-typehints>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint]
select = [
  "ALL",
] # Select all the rules by default, we'll exclude explicitly below

ignore = [
  ### Modules
  "COM",
  "DJ",
  "EXE",
  "T10",
  "TID",
  "TD",  # TODO rules

  ### Specific rules
  "E501",   # Lines too long
  "COM819", # Trailing commas
  "FIX002", # Can't commit when TODO present
  "D104",   # No public docstring in package
  "D203",   # Blank line before class docstring
  "D213",   # Multi-line docstring summary should start at the first line
  "ANN401", # Missing type annotation for self in method
  "F722",   # Syntax error in forward annotation (jaxtyping syntax)
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "SIM118", # use key in dict instead of key in dict.keys() -> there's a conflict when iterating over the keys of a dict
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"tests/**/*.py" = ["S101", "ANN201", "NPY002", "PLR2004", "RUF043"]  # Allow asserts, no return type annotations, allow legacy numpy random, magic values, regex patterns

[tool.basedpyright]
reportAnyType = false
